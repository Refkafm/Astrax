name: catatan_uang
description: Pembukuan keuangan pribadi Indonesia, lokal dan tanpa login.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  drift: ^2.35.1
  sqlite3: ^3.1.0
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2
  timezone: ^0.10.1
  uuid: ^4.5.1
  flutter_secure_storage: ^10.0.0
  share_plus: ^13.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.7.0
flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
